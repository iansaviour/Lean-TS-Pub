name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dapp/package-lock.json
            dapp_vote/package-lock.json
            dapp_new_vote/package-lock.json
      - run: npm ci
        working-directory: dapp
      - run: npm run build
        working-directory: dapp
      - run: npm ci
        working-directory: dapp_vote
      - run: npm run build
        working-directory: dapp_vote
      - run: npm ci
        working-directory: dapp_new_vote
      - run: npm run build
        working-directory: dapp_new_vote
      - name: Assemble site
        run: |
          mkdir -p site/vote site/new-vote
          cp -a dapp/dist/. site/
          cp -a dapp_vote/dist/. site/vote/
          cp -a dapp_new_vote/dist/. site/new-vote/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
